<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Todo App</title>
    <link rel='stylesheet' href='main.css'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="flex flex-col justify-center items-center min-h-screen min-w-[100vw] max-w-[100vw]">
    <div
        class="pt-[3em] max-w-full min-w-[100%] min-h-screen text-white box bg-black flex flex-col justify-center items-center">
        <div class="content min-w-[100%] max-[1020px]:px-[1em] min-[1020px]:w-3/5">
            <header
                class="flex flex-col min-[1020px]:flex-row justify-between items-center border-b-2 mb-[2em] border-b-gray-700 pb-[1em]">
                <h1 class="font-[Syne] text-6xl text-[#c9ccd1] font-bold">Tasks</h1>
                <p class="header-right"><span class="number-completed">0</span> <span class="text-[#80838a]">of
                    </span><span class="text-[#80838a] number-available"> 0
                    </span><span class="text-[#80838a]"> done</span></p>
            </header>

            <form class="w-full flex justify-center items-center min-[1020px]:gap-[1em] gap-[5px] mb-[2em]">
                <input type="text" name="task" id="task" placeholder="Add task"
                    class="task-input border border-[#c9ccd1] rounded-md p-[1em] h-[3.5em] min-[200px]:min-w-[70%] min-[1020px]:flex-6 focus:border-[#c9ccd1] focus:outline-transparent placeholder:text-gray-500 placeholder:italic">
                <button type="submit" disabled
                    class="submit-btn disabled:text-white disabled:cursor-not-allowed h-[3.5em] min-[200px]:min-w-[30%] disabled:bg-gray-400 min-[1020px]:flex-1 text-2md font-medium cursor-pointer rounded-md">Add
                    Task</button>
            </form>

            <div class="function-buttons border-b-1 border-b-gray-700 pb-[1em] text-[#c9ccd1]">
                <button
                    class="all-btn border border-gray-700 rounded-lg p-[3px] h-[2em] w-[5em] hover:bg-[#f2f3f5] cursor-pointer hover:text-black">
                    All
                </button>

                <button
                    class="active-btn border border-gray-700 rounded-lg p-[3px] h-[2em] w-[5em] hover:bg-[#f2f3f5] cursor-pointer hover:text-black">
                    Active
                </button>

                <button
                    class="completed-btn border border-gray-700 rounded-lg p-[3px] h-[2em] w-[5em] hover:bg-[#f2f3f5] cursor-pointer hover:text-black">
                    Done
                </button>
            </div>
            <div class="info-card border-b-1 border-b-gray-700 p-[3px] flex justify-center items-center h-[4em]">
                <p class="text-[#c9ccd1]">No tasks yet. Add your first one above.</p>
            </div>

            <ul>

            </ul>

            <button
                class="remove-btn bg-red-600 text-white rounded-lg mt-[1em] p-[3px] h-[2em] w-[5em] hover:bg-red-500 cursor-pointer hover:text-black">
                Delete all
            </button>
        </div>

        <footer class="mt-auto">
            <p class="text-[#c9ccd1]">Designed and built by Generalissimo</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>

</html>
